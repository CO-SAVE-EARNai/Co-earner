<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Co Save & Earn</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(160deg,#031b16,#063b2f,#02120f);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
  background:#08251f;
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#55e6b0;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#a9c8bf;
  margin-bottom:25px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#cce4dd;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #24564a;
  background:#061914;
  color:white;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#55e6b0;
}

.checkbox{
  display:flex;
  align-items:flex-start;
  gap:8px;
  margin:18px 0;
  color:#a9c8bf;
  font-size:13px;
}

.checkbox input{
  width:auto;
  margin-top:2px;
}

button{
  width:100%;
  border:none;
  padding:15px;
  border-radius:13px;
  background:#55e6b0;
  color:#04231b;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:14px;
  min-height:20px;
}

.login{
  text-align:center;
  margin-top:20px;
  color:#a9c8bf;
}

.login a{
  color:#55e6b0;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Co Save & Earn</div>
  <div class="subtitle">Save • Earn • Grow</div>

  <h2>Create Your Account</h2>

  <form id="registerForm">

    <label>Full Name</label>
    <input
      type="text"
      id="fullName"
      placeholder="Enter your full name"
      required
    >

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      placeholder="Enter your phone number"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Create a password"
      minlength="6"
      required
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm your password"
      minlength="6"
      required
    >

    <div class="checkbox">
      <input type="checkbox" id="terms" required>
      <span>I agree to the Co Save & Earn terms.</span>
    </div>

    <button type="submit">Create Account</button>

    <div class="message" id="message"></div>

  </form>

  <div class="login">
    Already have an account?
    <a href="login.html">Login</a>
  </div>

</div>

<script>

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e){

  e.preventDefault();

  const fullName =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const phone =
    document.getElementById("phone").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if(password !== confirmPassword){

    message.style.color = "#ff7777";
    message.textContent = "Passwords do not match.";
    return;
  }

  if(password.length < 6){

    message.style.color = "#ff7777";
    message.textContent =
      "Password must contain at least 6 characters.";
    return;
  }

  /*
     Get existing accounts.
  */
  let accounts =
    JSON.parse(localStorage.getItem("coAccounts") || "[]");

  /*
     Prevent duplicate email.
  */
  const existing =
    accounts.find(account =>
      account.email === email
    );

  if(existing){

    message.style.color = "#ff7777";
    message.textContent =
      "An account with this email already exists.";
    return;
  }

  /*
     Create a completely unique user ID.
  */
  const userId =
    "USER-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  /*
     Create referral code for this user.
  */
  const referralCode =
    "CO" +
    Math.random()
      .toString(36)
      .substring(2,8)
      .toUpperCase();

  /*
     Create the new account.
  */
  const newAccount = {

    id: userId,

    name: fullName,

    email: email,

    phone: phone,

    password: password,

    referralCode: referralCode,

    referredBy: null,

    balance: 0,

    totalDeposited: 0,

    totalWithdrawn: 0,

    referralCount: 0,

    referralRewards: 0,

    transactions: [],

    savings: [],

    createdAt: new Date().toISOString()
  };

  /*
     Check whether this person came
     through somebody's referral link.
  */
  const params =
    new URLSearchParams(window.location.search);

  const referral =
    params.get("ref");

  if(referral){

    const referrer =
      accounts.find(account =>
        account.referralCode === referral
      );

    if(referrer){

      newAccount.referredBy =
        referrer.referralCode;

      referrer.referralCount =
        Number(referrer.referralCount || 0) + 1;
    }
  }

  /*
     Save the updated accounts.
  */
  accounts.push(newAccount);

  localStorage.setItem(
    "coAccounts",
    JSON.stringify(accounts)
  );

  /*
     IMPORTANT:
     Store ONLY this person's ID
     as the current logged-in account.
  */
  localStorage.setItem(
    "coCurrentUserId",
    userId
  );

  /*
     Keep compatibility with the
     old dashboard.
  */
  localStorage.setItem(
    "coLoggedIn",
    "true"
  );

  message.style.color = "#55e6b0";
  message.textContent =
    "Account created successfully!";

  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  }, 700);

});

</script>

</body>
</html>
