<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Co Earner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">Co<span>Earner</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="saving-banks.html">Saving Banks</a>
        <a href="login.html">Login</a>
    </nav>
</header>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">Co<span>Earner</span></div>

            <h1>Create Your Account</h1>

            <p>
                Create your Co Earner account and start your saving journey.
            </p>
        </div>


        <!-- SELECTED BANK -->
        <div class="selected-bank" id="selectedBankBox">
            <span>Selected Saving Bank</span>
            <strong id="selectedBank">Loading...</strong>
        </div>


        <form id="registerForm">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >
            </div>


            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >
            </div>


            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >
            </div>


            <label class="terms-check">
                <input type="checkbox" required>
                <span>I agree to the Co Earner terms and conditions.</span>
            </label>


            <button type="submit" class="auth-btn">
                Create Account
            </button>

        </form>


        <div class="auth-footer">
            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>

    </div>

</section>


<footer>
    <div class="logo">Co<span>Earner</span></div>
    <p>Save More. Grow Together.</p>
</footer>


<script>
    const params = new URLSearchParams(window.location.search);
    const bank = params.get("bank");

    const selectedBank = document.getElementById("selectedBank");
    const selectedBankBox = document.getElementById("selectedBankBox");

    const bankNames = {
        "20000-20days": "20,000 • 20 DAYS",
        "30000-20days": "30,000 • 20 DAYS",
        "50000-20days": "50,000 • 20 DAYS",
        "100000-20days": "100,000 • 20 DAYS",

        "20000-30days": "20,000 • 30 DAYS",
        "30000-30days": "30,000 • 30 DAYS",
        "50000-30days": "50,000 • 30 DAYS",
        "100000-30days": "100,000 • 30 DAYS"
    };

    if (bank && bankNames[bank]) {
        selectedBank.textContent = bankNames[bank];
    } else {
        selectedBank.textContent = "No bank selected";
    }


    
    document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
<style>

.register-card {
    max-width: 560px !important;
    padding: 45px 42px !important;
}

#registerForm {
    width: 100% !important;
}

/* More space between each field */
#registerForm .form-group {
    margin-bottom: 27px !important;
}

/* More space between labels and boxes */
#registerForm label {
    display: block !important;
    margin-bottom: 11px !important;
    font-size: 16px !important;
    line-height: 1.6 !important;
}

/* Bigger input boxes */
#registerForm input {
    width: 100% !important;
    height: 60px !important;
    padding: 0 20px !important;
    font-size: 16px !important;
    border-radius: 14px !important;
}

/* Bigger text inside the boxes */
#registerForm input::placeholder {
    font-size: 15px !important;
}

/* Bigger register button */
#registerForm button {
    width: 100% !important;
    min-height: 60px !important;
    padding: 15px 20px !important;
    font-size: 17px !important;
    border-radius: 14px !important;
    margin-top: 5px !important;
}

/* Give the selected saving bank box more breathing room */
.selected-bank,
.bank-selection,
.selected-plan {
    padding: 18px 20px !important;
    margin-bottom: 28px !important;
    line-height: 1.7 !important;
}

/* Mobile */
@media (max-width: 600px) {
    .register-card {
        padding: 35px 22px !important;
    }

    #registerForm input {
        height: 60px !important;
        font-size: 16px !important;
    }
}
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const form = document.querySelector("form");

    if (form) {
        form.addEventListener("submit", function (event) {

            event.preventDefault();

            localStorage.setItem("coLoggedIn", "true");

            window.location.href = "dashboard.html";
        });
    }

    const buttons = document.querySelectorAll("button");

    buttons.forEach(function(button) {

        if (
            button.textContent.toLowerCase().includes("register") ||
            button.textContent.toLowerCase().includes("sign up")
        ) {

            button.addEventListener("click", function () {

                localStorage.setItem("coLoggedIn", "true");

                window.location.href = "dashboard.html";

            });

        }

    });

});
                </script>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const buttons = document.querySelectorAll("button, a");

    buttons.forEach(function (button) {

        const text = button.textContent.toLowerCase().trim();

        if (
            text.includes("get started") ||
            text.includes("register") ||
            text.includes("sign up")
        ) {
            button.addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "register.html";
            });
        }

        if (
            text.includes("login") ||
            text.includes("log in")
        ) {
            button.addEventListener("click", function (event) {
                event.preventDefault();
                window.location.href = "login.html";
            });
        }

    });

});
        </script>
