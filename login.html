<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Co Save & Earn</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(160deg,#031b16,#063b2f,#02120f);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
  background:#08251f;
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  padding:30px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#55e6b0;
  margin-bottom:6px;
}

.subtitle{
  text-align:center;
  color:#a9c8bf;
  margin-bottom:28px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#cce4dd;
  font-size:14px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #24564a;
  background:#061914;
  color:white;
  outline:none;
  font-size:15px;
}

button{
  width:100%;
  margin-top:22px;
  border:none;
  padding:15px;
  border-radius:13px;
  background:#55e6b0;
  color:#04231b;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:15px;
  min-height:20px;
  font-size:14px;
}

.register{
  text-align:center;
  margin-top:22px;
  color:#a9c8bf;
}

.register a{
  color:#55e6b0;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">Co Save & Earn</div>
  <div class="subtitle">Save • Earn • Grow</div>

  <h2>Welcome Back</h2>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <button type="submit">
      Login
    </button>

    <div
      class="message"
      id="message">
    </div>

  </form>

  <div class="register">
    Don't have an account?
    <a href="register.html">
      Create Account
    </a>
  </div>

</div>

<script>

const form =
  document.getElementById("loginForm");

const message =
  document.getElementById("message");

form.addEventListener("submit", function(e){

  e.preventDefault();

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

  const password =
    document
      .getElementById("password")
      .value;

  const accounts =
    JSON.parse(
      localStorage.getItem("coAccounts") || "[]"
    );

  /*
     Find the exact account.
  */
  const account =
    accounts.find(user =>
      user.email === email &&
      user.password === password
    );

  if(!account){

    message.style.color = "#ff7777";

    message.textContent =
      "Incorrect email or password.";

    return;
  }

  /*
     THIS is the important part.
     We remember exactly which account
     is logged in.
  */
  localStorage.setItem(
    "coCurrentUserId",
    account.id
  );

  localStorage.setItem(
    "coLoggedIn",
    "true"
  );

  message.style.color =
    "#55e6b0";

  message.textContent =
    "Login successful!";

  setTimeout(function(){

    window.location.href =
      "dashboard.html";

  }, 500);

});

</script>

</body>
    </html>
