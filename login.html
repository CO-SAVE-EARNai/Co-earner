<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Co Earner</title>
    <link rel="stylesheet" href="style.css">
</head>
<script>
function loginUser() {
    localStorage.setItem("coLoggedIn", "true");
    window.location.href = "dashboard.html";
}
</script>
<body>

<header class="navbar">
    <div class="logo">Co<span>Earner</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="saving-banks.html">Saving Banks</a>
        <a href="register.html">Register</a>
    </nav>
</header>


<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">
            <div class="auth-logo">Co<span>Earner</span></div>

            <h1>Welcome Back</h1>

            <p>
                Login to your Co Earner account and continue your saving journey.
            </p>
        </div>


        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>


            <div class="login-options">

                <label class="remember-check">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <a href="#" onclick="showForgotMessage(); return false;">
                    Forgot Password?
                </a>

            </div>


            <button type="submit" class="auth-btn">
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <div class="new-account">
            <p>Don't have an account?</p>

            <a href="register.html" class="secondary-auth-btn">
                Create Account
            </a>
        </div>


        <div class="auth-footer">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</section>


<footer>
    <div class="logo">Co<span>Earner</span></div>
    <p>Save More. Grow Together.</p>
</footer>


<script>
    
    document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    window.location.href = "dashboard.html";
});

    function showForgotMessage() {
        alert("Password recovery will be available when secure account authentication is connected.");
    }
</script>

</body>
  </html>
