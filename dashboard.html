/* ================================
   MAKE THE SAVING BANKS SWIPEABLE
   ================================ */

const banksWrapper = document.querySelector(".banks-wrapper");

if (banksWrapper) {

  let startX = 0;
  let startY = 0;

  banksWrapper.addEventListener("touchstart", function(event) {
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  });

  banksWrapper.addEventListener("touchend", function(event) {

    const endX = event.changedTouches[0].clientX;
    const endY = event.changedTouches[0].clientY;

    const differenceX = startX - endX;
    const differenceY = startY - endY;

    /* Only respond to horizontal swipes */
    if (Math.abs(differenceX) > Math.abs(differenceY)) {

      if (differenceX > 50) {
        banksWrapper.scrollBy({
          left: 250,
          behavior: "smooth"
        });
      }

      if (differenceX < -50) {
        banksWrapper.scrollBy({
          left: -250,
          behavior: "smooth"
        });
      }

    }

  });

}


/* ================================
   PREVENT BUTTONS FROM RELOADING
   ================================ */

document.querySelectorAll("button").forEach(function(button) {

  button.addEventListener("click", function(event) {
    event.stopPropagation();
  });

});


/* ================================
   DASHBOARD NAVIGATION
   ================================ */

document.querySelectorAll(".nav-item").forEach(function(item) {

  item.addEventListener("click", function() {

    document.querySelectorAll(".nav-item").forEach(function(nav) {
      nav.classList.remove("active");
    });

    this.classList.add("active");

  });

});


/* ================================

window.addEventListener("load", function() {

  document.body.style.opacity = "1";

<script>

/* =========================================
   CO SAVE & EARN — LIVE BALANCE
   ========================================= */

(function () {

  function updateDashboardBalance() {

    const balance =
      Number(localStorage.getItem("coBalance")) || 0;

    const balanceElement =
      document.querySelector(".balance");

    if (balanceElement) {
      balanceElement.textContent =
        "UGX " + balance.toLocaleString();
    }

  }

  /* Show balance when dashboard opens */
  updateDashboardBalance();

})();


/* =========================================
   SHOW SAVED TRANSACTIONS
   ========================================= */

(function () {

  const activity =
    document.querySelector(".activity");

  if (!activity) {
    return;
  }

  const transactions =
    JSON.parse(
      localStorage.getItem("coTransactions") || "[]"
    );

  if (transactions.length === 0) {
    return;
  }

  activity.innerHTML = "";

  transactions.slice(0, 5).forEach(function (transaction) {

    const item =
      document.createElement("div");

    item.className = "activity-item";

    item.innerHTML = `
      <div class="activity-left">

        <div class="activity-icon">
          ${transaction.type === "Deposit" ? "💰" : "💸"}
        </div>

        <div>
          <div class="activity-name">
            ${transaction.type}
          </div>

          <div class="activity-date">
            ${transaction.bank || "Co Save & Earn"}
            • ${transaction.date}
          </div>
        </div>

      </div>

      <div class="activity-amount">
        + UGX ${Number(transaction.amount).toLocaleString()}
      </div>
    `;

    activity.appendChild(item);

  });

})();

</script>
